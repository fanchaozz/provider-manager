name: publish

# Publish to GitHub Packages on every GitHub release.
# Creates the package via `npm publish` to https://npm.pkg.github.com/.
# Uses the auto-injected GITHUB_TOKEN (repo:packages:write scope by default).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      # .npmrc for publishing to GitHub Packages
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
